name: Publish

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run lint + pack --dry-run without publishing'
        required: false
        default: 'false'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org/

      - run: npm ci
      - run: npm run lint

      - name: Verify package tarball
        run: npm pack --dry-run

      - name: Publish to npm
        if: github.event.inputs.dry-run != 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify install from npm
        if: github.event.inputs.dry-run != 'true'
        run: |
          tmpdir=$(mktemp -d)
          cd "$tmpdir"
          npm init -y
          npm install @dingmenghua/playwright-mcp-cdp-session@latest
          ./node_modules/.bin/playwright-mcp-cdp --help
